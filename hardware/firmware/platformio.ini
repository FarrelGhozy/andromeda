[platformio]
src_dir = src
include_dir = include

[env:esp32dev]
; Pinned to a specific version for deterministic/reproducible builds.
; Bump deliberately (see release_guide.md) when updating the toolchain.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_upload.speed = 115200
board_upload.flash_size = 4MB
lib_deps =
    bblanchon/ArduinoJson @ 6.21.3
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wno-unused-variable
    -Wno-unused-but-set-variable
