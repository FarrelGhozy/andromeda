name: andromeda
description: "ANDROMEDA - IoT Drip Irrigation Automation - Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # ====================
  # BACKEND & NETWORK
  # ====================
  supabase_flutter: ^2.8.0
  http: ^1.2.0

  # ====================
  # STATE MANAGEMENT
  # ====================
  provider: ^6.1.0

  # ====================
  # CHART & VISUALISASI
  # ====================
  fl_chart: ^0.69.0
  google_fonts: ^6.2.0

  # ====================
  # UI COMPONENTS
  # ====================
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # ====================
  # UTILITY
  # ====================
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
