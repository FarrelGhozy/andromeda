name: andromeda
description: "ANDROMEDA - IoT Drip Irrigation Automation - Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ====================
  # BACKEND & NETWORK
  # ====================
  supabase_flutter: ^2.16.0       # Supabase REST + Realtime
  http: ^1.3.0                     # HTTP fallback

  # ====================
  # STATE MANAGEMENT
  # ====================
  provider: ^6.1.5+1               # State management

  # ====================
  # CHART & VISUALISASI
  # ====================
  fl_chart: ^1.2.0                 # Grafik kelembaban
  google_fonts: ^6.2.1             # Font PlusJakartaSans

  # ====================
  # UI COMPONENTS
  # ====================
  shimmer: ^3.0.0                  # Loading shimmer effect
  flutter_svg: ^2.0.17             # SVG icons
  cached_network_image: ^3.4.1     # Cache gambar

  # ====================
  # UTILITY
  # ====================
  intl: ^0.20.3                    # Format tanggal
  connectivity_plus: ^6.1.2        # Deteksi koneksi internet
  package_info_plus: ^8.1.4        # Info versi app
  url_launcher: ^6.3.1             # Buka link eksternal
  share_plus: ^10.1.4              # Share data/CSV
  path_provider: ^2.1.5            # Path lokal untuk ekspor
  permission_handler: ^11.3.1      # Izin storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
